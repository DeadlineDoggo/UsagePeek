<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Usage Peek</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="85%"><stop offset="0" stop-color="#21507f"/><stop offset=".5" stop-color="#12243f"/><stop offset="1" stop-color="#090f1d"/></radialGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(-135 .5 .5)"><stop offset="0" stop-color="#4cd964"/><stop offset=".4" stop-color="#f5e050"/><stop offset=".7" stop-color="#ffa43a"/><stop offset="1" stop-color="#ff4d4d"/></linearGradient>
    <linearGradient id="bar1" x1="0" x2="1"><stop offset="0" stop-color="#3daee9"/><stop offset="1" stop-color="#7fd6ff"/></linearGradient>
    <linearGradient id="bar2" x1="0" x2="1"><stop offset="0" stop-color="#4cd964"/><stop offset="1" stop-color="#b6f06a"/></linearGradient>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <!-- CPU usage ring -->
  <circle cx="256" cy="212" r="106" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="30"/>
  <circle cx="256" cy="212" r="106" fill="none" stroke="url(#spec)" stroke-width="30" stroke-linecap="round" stroke-dasharray="500 666" transform="rotate(135 256 212)" filter="url(#g)"/>
  <rect x="226" y="182" width="60" height="60" rx="10" fill="#e6ecff"/>
  <rect x="238" y="194" width="36" height="36" rx="5" fill="#12243f"/>
  <g fill="#e6ecff"><rect x="236" y="170" width="6" height="12" rx="2"/><rect x="253" y="170" width="6" height="12" rx="2"/><rect x="270" y="170" width="6" height="12" rx="2"/>
  <rect x="236" y="242" width="6" height="12" rx="2"/><rect x="253" y="242" width="6" height="12" rx="2"/><rect x="270" y="242" width="6" height="12" rx="2"/></g>
  <!-- memory and disk bars -->
  <rect x="96" y="362" width="320" height="26" rx="13" fill="#fff" fill-opacity=".10"/>
  <rect x="96" y="362" width="214" height="26" rx="13" fill="url(#bar1)" filter="url(#g)"/>
  <rect x="96" y="408" width="320" height="26" rx="13" fill="#fff" fill-opacity=".10"/>
  <rect x="96" y="408" width="140" height="26" rx="13" fill="url(#bar2)" filter="url(#g)"/>
</svg>
